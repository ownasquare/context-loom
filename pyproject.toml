[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "context-loom"
version = "0.1.0"
description = "Local-first, fidelity-audited context compilation for AI chat harnesses"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Context Loom Contributors" }]
keywords = ["ai", "context", "prompt-optimization", "fastapi", "mcp", "rag", "tokens"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "filelock>=3.32.3,<4",
  "httpx>=0.28,<1",
  "mcp>=2.0.0,<3",
  "pathspec>=1.1.1,<2",
  "platformdirs>=4.11.2,<5",
  "pyarrow>=25.0.1,<26",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart>=0.0.20,<1",
  "rich>=15.0.0,<16",
  "tiktoken>=0.12,<1",
  "typer>=0.27.1,<1",
  "uvicorn[standard]>=0.52.3,<0.53",
]

[project.urls]
Homepage = "https://github.com/ownasquare/context-loom"
Repository = "https://github.com/ownasquare/context-loom"
Documentation = "https://github.com/ownasquare/context-loom/tree/main/docs"
Issues = "https://github.com/ownasquare/context-loom/issues"
Changelog = "https://github.com/ownasquare/context-loom/blob/main/CHANGELOG.md"

[project.scripts]
context-loom = "context_loom.cli:app"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "build>=1.4,<2",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.9,<3",
  "pytest==9.1.1",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "pytest-playwright>=0.9.0,<1",
  "pytest-socket>=0.7,<1",
  "ruff>=0.16.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/context_loom"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/context-loom/**",
  "/docs/handoffs/**",
  "/docs/superpowers/**",
  "/frontend/docs/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises durable local storage or application boundaries",
  "contract: checks public API, adapter, MCP, or proxy contracts",
  "e2e: exercises the rendered workbench with Playwright",
  "live: makes an explicitly opted-in local-model, harness, or provider call",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["context_loom"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["context_loom"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mcp.*", "pyarrow.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "frontend"]
skips = ["B101"]
